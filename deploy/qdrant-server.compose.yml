services:
  qdrant:
    # Tag legível + digest imutável do manifesto multiarch oficial.
    image: qdrant/qdrant:v1.18.3@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    env_file:
      - /srv/hive-private/qdrant.env
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__SERVICE__JWT_RBAC: "true"
      QDRANT__SERVICE__ENABLE_TLS: "true"
      QDRANT__TLS__CERT: /qdrant/tls/server.crt
      QDRANT__TLS__KEY: /qdrant/tls/server.key
    volumes:
      - hive_server_storage:/qdrant/storage
      - hive_server_snapshots:/qdrant/snapshots
      - /srv/hive-private/tls:/qdrant/tls:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # A imagem não inclui curl; o check interno confirma o listener TLS.
      # O deploy_server.sh complementa isto com uma consulta autenticada.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  hive_server_storage:
  hive_server_snapshots:
