services:
  # ---------------------------------------------------------------------------
  # 1. Qdrant Vector Database
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__API_KEY=${HIVE_QDRANT_ADMIN_KEY:?set HIVE_QDRANT_ADMIN_KEY}
      - QDRANT__SERVICE__JWT_RBAC=true
      - RUST_LOG=info
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. Ollama AI Engine
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.34.0
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434" # Local-only Ollama API.
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped
    # 💡 UNCOMMENT the deploy block below if you have an NVIDIA GPU for massive acceleration!
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 4. Go Qdrant-RAG MCP Server Container (Containerized Run Option)
  # ---------------------------------------------------------------------------
  qdrant-mcp-server:
    profiles: ["mcp"]
    stdin_open: true
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qdrant-mcp-server
    environment:
      - HIVE_ID=local-hive
      - HIVE_DEVICE_ID=docker-writer
      - HIVE_WRITER_APPROVAL_ID=local-compose
      - HIVE_ROLE=writer
      - HIVE_COLLECTION=hive_mind_v01
      - HIVE_DATA_DIR=/workspace
      - QDRANT_URL=http://127.0.0.1:6334
      # A JWT restricted to rw on hive_mind_v01 and hive_mind_v01__control.
      # Never pass HIVE_QDRANT_ADMIN_KEY to this process.
      - QDRANT_API_KEY=${HIVE_QDRANT_WRITER_TOKEN:-}
      - OLLAMA_URL=http://127.0.0.1:11434
      - EMBEDDING_MODEL=nomic-embed-text
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ${HIVE_DATA_DIR:-./hive-data}:/workspace:ro
      - hive_audit:/var/lib/hive/audit
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy

volumes:
  hive_audit:
  qdrant_storage:
    name: qdrant_storage
  ollama_storage:
    name: ollama_storage
