name: Publish v0.2.0 clients (Linux and macOS)

# Recovery path for the immutable v0.2.0 tag: its Windows build failed after
# the Linux/macOS artifacts and security checks had passed. This workflow only
# publishes the four verified client archives from that exact run.
on:
  workflow_dispatch:

concurrency:
  group: publish-client-v0.2.0
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Verify, sign and publish client assets
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: v0.2.0
      SOURCE_COMMIT: 834757579e1aa84ae061e80cf6c2c483550bc183
      SOURCE_RUN: '35867915480'
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v0.2.0
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and successful source checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-list -n 1 "$VERSION")" = "$SOURCE_COMMIT"
          run_url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$run_url" \
            | jq -e --arg sha "$SOURCE_COMMIT" '.head_sha == $sha and .event == "push"' >/dev/null
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$run_url/jobs?per_page=30" \
            | jq -e '[.jobs[] | select(.name == "Test and verify release tag" or .name == "security / verify") | .conclusion] | length == 2 and all(.[]; . == "success")' >/dev/null

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify source again
        run: |
          go mod verify
          go test ./...

      - name: Download successful Linux and macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 35867915480
          github-token: ${{ github.token }}
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Verify exact client asset set
        run: |
          expected=(
            "hive-mind-${VERSION}-linux-amd64.tar.gz"
            "hive-mind-${VERSION}-linux-arm64.tar.gz"
            "hive-mind-${VERSION}-darwin-amd64.tar.gz"
            "hive-mind-${VERSION}-darwin-arm64.tar.gz"
          )
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
          for asset in "${expected[@]}"; do
            test -s "dist/$asset"
            test "$(tar -tzf "dist/$asset")" = hive-mind
          done
          tar -C "$RUNNER_TEMP" -xzf "dist/${expected[0]}" hive-mind
          chmod +x "$RUNNER_TEMP/hive-mind"
          "$RUNNER_TEMP/hive-mind" version \
            | jq -e --arg version "$VERSION" --arg commit "$SOURCE_COMMIT" \
                '.version == $version and .source_revision == $commit' >/dev/null

      - name: Create SBOM and checksums
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          GOBIN="$RUNNER_TEMP/release-tools" \
            go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          "$RUNNER_TEMP/release-tools/cyclonedx-gomod" mod -licenses -json \
            -output "dist/hive-mind-${VERSION}.cdx.json" .
          printf 'version=%s\ncommit=%s\n' "$VERSION" "$SOURCE_COMMIT" > dist/SOURCE.txt
          (cd dist && sha256sum ./* > SHA256SUMS)

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v3.1.3

      - name: Sign release checksums with GitHub OIDC
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Verify the exact manual-workflow signer
        run: |
          cosign verify-blob \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity \
              "https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-client-v020.yml@refs/heads/main" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            dist/SHA256SUMS

      - name: Attest client assets
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS

      - name: Publish client-only GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.2.0
          name: Hive Mind v0.2.0 (Linux/macOS)
          body: |
            Release de clientes Linux e macOS para a tag imutável v0.2.0.
            O build Windows da execução original falhou; Windows e o bundle de
            deploy do servidor não fazem parte desta publicação. Testes e CI de
            segurança passaram. Os checksums foram assinados neste workflow
            manual com OIDC do GitHub.
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
