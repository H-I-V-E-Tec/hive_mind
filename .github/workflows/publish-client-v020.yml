name: Publish v0.2.0 clients (Linux and macOS)

# Recovery path for the immutable v0.2.0 tag. Windows is intentionally not in
# this workflow because its original build failed; the four supported client
# archives are rebuilt directly from the immutable tag.
on:
  workflow_dispatch:

concurrency:
  group: publish-client-v0.2.0
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_clients:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: ubuntu-latest
          - goos: linux
            goarch: arm64
            os: ubuntu-latest
          - goos: darwin
            goarch: amd64
            os: macos-latest
          - goos: darwin
            goarch: arm64
            os: macos-latest
    env:
      VERSION: v0.2.0
      SOURCE_COMMIT: 834757579e1aa84ae061e80cf6c2c483550bc183
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v0.2.0
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable tag
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-list -n 1 "$VERSION")" = "$SOURCE_COMMIT"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux ARM64 cross compiler
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build client archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          GITHUB_SHA="$SOURCE_COMMIT" bash scripts/build_release.sh
          asset="dist/hive-mind-${VERSION}-${GOOS}-${GOARCH}.tar.gz"
          test -s "$asset"
          test "$(tar -tzf "$asset")" = hive-mind
          if [ "$GOOS" = linux ] && [ "$GOARCH" = amd64 ]; then
            tar -C "$RUNNER_TEMP" -xzf "$asset" hive-mind
            chmod +x "$RUNNER_TEMP/hive-mind"
            "$RUNNER_TEMP/hive-mind" version \
              | jq -e --arg version "$VERSION" --arg commit "$SOURCE_COMMIT" \
                  '.version == $version and .source_revision == $commit' >/dev/null
          fi

      - name: Upload client artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Sign and publish client assets
    needs: build_clients
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: v0.2.0
      SOURCE_COMMIT: 834757579e1aa84ae061e80cf6c2c483550bc183
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v0.2.0
          fetch-depth: 0
          persist-credentials: false

      - name: Download client artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Verify exact client asset set
        run: |
          expected=(
            "hive-mind-${VERSION}-linux-amd64.tar.gz"
            "hive-mind-${VERSION}-linux-arm64.tar.gz"
            "hive-mind-${VERSION}-darwin-amd64.tar.gz"
            "hive-mind-${VERSION}-darwin-arm64.tar.gz"
          )
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
          for asset in "${expected[@]}"; do
            test -s "dist/$asset"
            test "$(tar -tzf "dist/$asset")" = hive-mind
          done

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create SBOM and checksums
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          GOBIN="$RUNNER_TEMP/release-tools" \
            go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          "$RUNNER_TEMP/release-tools/cyclonedx-gomod" mod -licenses -json \
            -output "dist/hive-mind-${VERSION}.cdx.json" .
          printf 'version=%s\ncommit=%s\n' "$VERSION" "$SOURCE_COMMIT" > dist/SOURCE.txt
          (cd dist && sha256sum ./* > SHA256SUMS)

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v3.1.3

      - name: Sign release checksums with GitHub OIDC
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Verify the exact manual-workflow signer
        run: |
          cosign verify-blob \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity \
              "https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-client-v020.yml@refs/heads/main" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            dist/SHA256SUMS

      - name: Attest client assets
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS

      - name: Publish client-only GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.2.0
          name: Hive Mind v0.2.0 (Linux/macOS)
          body: |
            Release de clientes Linux e macOS para a tag imutável v0.2.0.
            O build Windows não faz parte desta publicação. Testes e CI de
            segurança foram aprovados; os checksums foram assinados neste
            workflow manual com OIDC do GitHub.
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
