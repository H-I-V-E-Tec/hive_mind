name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml

  test_and_verify:
    name: Test and verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable version tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-list -n 1 "$RELEASE_VERSION")" = "$GITHUB_SHA"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify and test
        run: |
          go mod verify
          go build -v ./...
          go test -v ./...
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s deploy -p 'test_*.py'

  build_matrix:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [test_and_verify, security]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: ubuntu-latest
          - goos: linux
            goarch: arm64
            os: ubuntu-latest
          - goos: darwin
            goarch: amd64
            os: macos-latest
          - goos: darwin
            goarch: arm64
            os: macos-latest
          - goos: windows
            goarch: amd64
            os: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux ARM64 cross compiler
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Windows cross compiler
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build Unix release archive
        if: matrix.goos != 'windows'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/build_release.sh

      - name: Build Windows release archive
        if: matrix.goos == 'windows'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/build_release.sh

      - name: Verify Windows release archive
        if: matrix.goos == 'windows'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          asset="dist/hive-mind-${RELEASE_VERSION}-windows-amd64.zip"
          test -s "$asset"
          test "$(unzip -Z1 "$asset")" = hive-mind.exe
          unzip -p "$asset" hive-mind.exe | file - | grep -q 'PE32+ executable'

      - name: Upload matrix artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  create_release:
    name: Sign and publish release
    needs: build_matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download matrix artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create SBOM and server bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          GOBIN="$RUNNER_TEMP/release-tools" \
            go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          "$RUNNER_TEMP/release-tools/cyclonedx-gomod" mod -licenses -json \
            -output "dist/hive-mind-${VERSION}.cdx.json" .
          printf '%s\n' "$GITHUB_SHA" > REVISION
          tar -czf "dist/hive-server-${VERSION}.tar.gz" \
            REVISION \
            deploy/qdrant-server.compose.yml \
            deploy/qdrant_admin.py \
            deploy/deploy_server.sh \
            deploy/hive-predeploy-backup.example \
            scripts/hive_backup.py \
            docs/operations/delivery-and-deployment.md
          rm REVISION
          printf 'version=%s\ncommit=%s\n' "$VERSION" "$GITHUB_SHA" > dist/SOURCE.txt
          (cd dist && sha256sum ./* > SHA256SUMS)

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v2.5.2

      - name: Sign release checksums with GitHub OIDC
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Attest release artifacts
        # GitHub Attestations are unavailable for this private organization
        # plan. Cosign still signs SHA256SUMS, so provenance is best-effort
        # until the organization enables the feature.
        continue-on-error: true
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.cdx.json
            dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hive Mind ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
