name: Deploy Qdrant server

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing signed release tag (vX.Y.Z)
        required: true
        type: string
      initial:
        description: First deployment on an empty server
        required: true
        default: false
        type: boolean

concurrency:
  group: hive-server-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Promote signed release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Validate requested version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]'

      - name: Configure restricted SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Ask server to pull and verify the release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ inputs.version }}
          INITIAL: ${{ inputs.initial }}
        run: |
          deploy_args=(sudo /usr/local/sbin/hive-pull-release "$VERSION")
          if [ "$INITIAL" = true ]; then deploy_args+=(--initial); fi
          ssh -i "$RUNNER_TEMP/ssh/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "${deploy_args[@]}"
