name: Security checks
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - name: Validate operational shell scripts
        run: |
          bash -n deploy/*.sh scripts/build_release.sh
          shellcheck deploy/*.sh scripts/build_release.sh
      - name: Vulnerability analysis
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Scan secrets in history and working files
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --no-banner --log-opts="--all" .
          gitleaks dir --redact --no-banner .
      - name: Backup tooling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Deployment tooling tests
        run: |
          python3 -m unittest discover -s deploy -p 'test_*.py'
          bash deploy/test_deploy_server.sh
      - name: Verify container build
        run: docker build --build-arg HIVE_VERSION=ci --build-arg HIVE_SOURCE_REVISION="$GITHUB_SHA" -t hive-security-check .
      - name: Inspect runtime permissions and scan final image
        run: |
          test "$(docker image inspect hive-security-check --format '{{.Config.User}}')" = hive
          staging=$(mktemp -d)
          container=$(docker create hive-security-check)
          trap 'docker rm "$container"' EXIT
          docker export "$container" | tar -x -C "$staging"
          gitleaks dir --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact --no-banner "$staging"
      - name: Build temporary main-branch candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          short_revision="${GITHUB_SHA:0:12}"
          version="0.0.0-candidate.${short_revision}"
          mkdir -p candidate/package candidate/dist
          CGO_ENABLED=1 go build -trimpath -buildvcs=true \
            -ldflags="-X main.Version=${version} -X main.SourceRevision=${GITHUB_SHA} -s -w" \
            -o candidate/package/hive-mind .
          tar -C candidate/package -czf "candidate/dist/hive-mind-${version}-linux-amd64.tar.gz" hive-mind
          (cd candidate/dist && sha256sum ./* > SHA256SUMS)
      - name: Upload temporary main-branch candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hive-mind-candidate-${{ github.sha }}
          path: candidate/dist/*
          if-no-files-found: error
          retention-days: 7

  windows_cross_build:
    name: Verify Windows cross build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Windows cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build and inspect Windows asset
        env:
          GOOS: windows
          GOARCH: amd64
          RELEASE_VERSION: v0.0.0-ci
        run: |
          bash scripts/build_release.sh
          asset="dist/hive-mind-${RELEASE_VERSION}-windows-amd64.zip"
          test -s "$asset"
          test "$(unzip -Z1 "$asset")" = hive-mind.exe
          unzip -p "$asset" hive-mind.exe | file - | grep -q 'PE32+ executable'

  native_platform_tests:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check C compiler for tree-sitter
        run: gcc --version
      - name: Run tests on the target OS
        env:
          CGO_ENABLED: 1
        run: go test ./...
